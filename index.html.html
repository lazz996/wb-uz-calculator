<style>
:root{--bg:#f5f4f7;--card:#fff;--tx:#1d1b22;--mu:#6b6776;--bd:#e3e0ea;--ac:#cb11ab;--ac2:#7b2fe0;--ok:#12904a;--bad:#d32f2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121a;--card:#201d29;--tx:#f1eff6;--mu:#a29db0;--bd:#33303f;--ac:#ff4fd8;--ac2:#a47bff;--ok:#4cd98b;--bad:#ff7b7b}}
:root[data-theme="dark"]{--bg:#14121a;--card:#201d29;--tx:#f1eff6;--mu:#a29db0;--bd:#33303f;--ac:#ff4fd8;--ac2:#a47bff;--ok:#4cd98b;--bad:#ff7b7b}

.w{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 18px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.g{grid-template-columns:1fr}}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
.c h2{font-size:15px;margin:0 0 12px;color:var(--ac2)}
label{display:block;font-size:13px;color:var(--mu);margin:0 0 10px}
input,select{width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.r4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--bd)}
.row span:first-child{color:var(--mu)}.row small{display:block;font-size:12px;color:var(--mu)}
.neg{color:var(--bad)}.big{font-size:30px;font-weight:700;margin:2px 0}
.hero{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;border:0}.hero .mu{opacity:.85;font-size:13px}
.hero .big.loss{color:#ffe1e1}
.tot{font-weight:700;border-bottom:0}.msg{font-size:13px;color:var(--mu);margin-top:8px}.err{color:var(--bad)}
details summary{cursor:pointer;color:var(--ac2);font-size:14px}
